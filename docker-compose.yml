services:
  postgres:
    image: postgres:16
    container_name: datapulse-postgres
    environment:
      POSTGRES_DB: datapulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - datapulse_pg_data:/var/lib/postgresql/data

volumes:
  datapulse_pg_data: