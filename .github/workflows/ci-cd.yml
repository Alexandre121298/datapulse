name: DataPulse CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    working-directory: datapulseAPI

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: datapulse-alexandre-2026
  REGION: europe-west1
  ARTIFACT_REPOSITORY: datapulse-images
  IMAGE_NAME: datapulse-api
  CLOUD_RUN_SERVICE: datapulse-api
  WORKLOAD_IDENTITY_PROVIDER: projects/722245064686/locations/global/workloadIdentityPools/github-actions/providers/datapulse-github
  DEPLOYER_SERVICE_ACCOUNT: github-actions-deployer@datapulse-alexandre-2026.iam.gserviceaccount.com

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datapulse
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d datapulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: datapulseAPI/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Maven verification
        run: ./mvnw --batch-mode clean verify

  deploy:
    name: Build and deploy
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          IMAGE_URL="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build --tag "${IMAGE_URL}" .
          echo "IMAGE_URL=${IMAGE_URL}" >> "$GITHUB_ENV"

      - name: Push Docker image
        run: docker push "${IMAGE_URL}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE_URL}" \
            --quiet

      - name: Display deployed service URL
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format="value(status.url)"
